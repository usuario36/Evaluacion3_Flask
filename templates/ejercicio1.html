<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1 - Notas</title>
    <link rel="stylesheet" href="/static/css/estilos.css">
</head>
<body>
    <div class="contenedor-formulario">
        <h2>Formulario de Notas</h2>
        
        <form method="POST">
            <label>Nota 1:</label>
            <input type="number" name="nota1" min="10" max="70" required>
            
            <label>Nota 2:</label>
            <input type="number" name="nota2" min="10" max="70" required>
            
            <label>Nota 3:</label>
            <input type="number" name="nota3" min="10" max="70" required>
            
            <label>Asistencia (%):</label>
            <input type="number" name="asistencia" min="0" max="100" required>
            
            <button type="submit">Enviar</button>
        </form>

        {% if promedio is not none %}
            <div class="resultado">
                <p>Promedio: {{ promedio }}</p>
                <p>Estado: {{ estado }}</p>
            </div>
        {% endif %}
        
        <br>
        <a href="/">Volver al inicio</a>
    </div>
</body>
</html>
